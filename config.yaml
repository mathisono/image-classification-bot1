image_roots:
  - name: "Pictures"
    path: "$HOME/Pictures"
    shared: false
    follow_symlinks: false
    enabled: true

  # Windows/SMB archive example. Mount it read/write on Linux first, then enable this root.
  # - name: "Windows Image Archive"
  #   path: "/mnt/image-archive"
  #   shared: true
  #   follow_symlinks: false
  #   enabled: true

server:
  host: "127.0.0.1"
  port: 8765

paths:
  # Keep the live SQLite database local. Do not run SQLite directly over SMB.
  database: "data/image_index.sqlite"
  thumbnails: "cache/thumbnails"
  analysis: "cache/analysis"

database_sync:
  # Enable after configuring the writable Windows-share destination.
  enabled: false
  # Store a consistent synchronized snapshot inside the selected archive folder.
  share_copy: "/mnt/image-archive/.image_librarian/image_index.sqlite"
  interval_seconds: 300
  restore_if_local_missing: true

scanner:
  skip_hidden_dirs: true
  shared_fs_stability_seconds: 5
  mark_missing_as: "MISSING_SOURCE"
  # Large archives should be scanned incrementally rather than loaded into memory.
  expected_archive_size: 500000

safety:
  max_original_file_mb: 300
  max_decode_pixels: 100000000
  vision_max_side_px: 1600
  thumbnail_max_side_px: 384

openclaw:
  coordinator_agent: "realtime_mini_voice"
  coordinator_model: "qwythos-9b-claude-mythos-5-1m@q4_k_m"
  vision_agent: "betty"

workers:
  recommended_count: 4
  poll_seconds: 2
  lease_seconds: 120
  hard_timeout_seconds: 75

vision:
  enabled: true
  base_url: "http://127.0.0.1:1234/v1"
  api_key: "not-needed"
  model: "lmstudio/zai-org/glm-4.6v-flash"
  timeout_seconds: 60
  prompt_version: "image_librarian_identify_beater_v2"
  structured_output: "pydantic_ai"
  fallback_to_legacy_json: false
