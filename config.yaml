image_roots:
  - name: "Pictures"
    path: "$HOME/Pictures"
    shared: false
    follow_symlinks: false
    enabled: true

  # Windows/SMB archive example. Mount it read-only on Linux first, then enable this root.
  # - name: "Windows Image Archive"
  #   path: "/mnt/image-archive"
  #   shared: true
  #   follow_symlinks: false
  #   enabled: true
  - name: "Image Archive"
    path: "/mnt/image-archive"
    shared: true
    follow_symlinks: false
    enabled: true

server:
  host: "127.0.0.1"
  port: 8765

paths:
  # Keep the live SQLite database local. Do not run SQLite directly over SMB.
  database: "data/image_index.sqlite"
  thumbnails: "cache/thumbnails"
  analysis: "cache/analysis"
  faces: "cache/faces"
  # Each GUI-requested Archive Map regeneration creates timestamped files here.
  map_snapshots: "data/map_snapshots"

archive_map:
  default_mode: "objects"
  # Hard GUI/generator ceiling. Large mode uses compact binary point buffers.
  max_points: 1000000
  # Up to this size the original metadata-rich JSON/SVG renderer is retained.
  large_map_threshold: 50000
  map_version: "archive_map_v2"
  # The map worker starts only from the Archive Map GUI and exits after one generation.
  one_shot_worker: true
  # Million-point generation can take substantially longer than a small snapshot.
  timeout_seconds: 3600
  search_result_limit: 10000

database_sync:
  enabled: false
  share_copy: "/mnt/image-archive/.image_librarian/image_index.sqlite"
  interval_seconds: 1800
  minimum_interval_seconds: 900
  preferred_interval_seconds: 1800
  maximum_interval_seconds: 21600
  restore_if_local_missing: true
  versioned_backups: true
  backup_directory: "/mnt/image-archive/.image_librarian/backups"
  compression_level: 6
  max_versions: 48

scanner:
  skip_hidden_dirs: true
  shared_fs_stability_seconds: 5
  mark_missing_as: "MISSING_SOURCE"
  expected_archive_size: 500000

safety:
  max_original_file_mb: 300
  max_decode_pixels: 100000000
  vision_max_side_px: 1600
  thumbnail_max_side_px: 384

openclaw:
  coordinator_agent: "realtime_mini_voice"
  coordinator_model: "qwythos-9b-claude-mythos-5-1m@q4_k_m"
  vision_agent: "betty"

workers:
  recommended_count: 3
  poll_seconds: 2
  lease_seconds: 120
  hard_timeout_seconds: 180

# Face images and embeddings stay local. One dedicated CPU worker detects each
# face with SCRFD and stores an ArcFace-compatible embedding for later matching.
faces:
  enabled: true
  backend: "insightface"
  model_pack: "buffalo_l"
  model_root: "data/insightface"
  cache_dir: "cache/faces"
  detector_model: "scrfd-det-10g"
  embedding_model: "arcface-w600k-r50"
  providers:
    - "CPUExecutionProvider"
  ctx_id: -1
  det_size: [640, 640]
  det_thresh: 0.55
  poll_seconds: 2

vision:
  enabled: true
  base_url: "http://192.168.3.38:1234/v1"
  api_key: "not-needed"
  model: "zai-org/glm-4.6v-flash"
  timeout_seconds: 180
  max_tokens: 2000
  prompt_version: "image_librarian_simple_questions_v1"
  structured_output: "legacy_json"
  fallback_to_legacy_json: false
