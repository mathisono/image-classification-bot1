<!doctype html><html><head><meta charset="utf-8"><title>Image Librarian</title>
<style>body{font-family:system-ui,Arial;margin:24px;background:#f7f7f7}a{color:#0645ad}.card{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #ccc}.grid{display:grid;grid-template-columns:120px 1fr 120px 220px;gap:12px;align-items:start}.thumb{max-width:110px;max-height:90px;border-radius:8px}.bad{color:#a00}.ok{color:#070}input,textarea,select{width:100%;padding:8px;box-sizing:border-box}button{padding:8px 12px;margin:4px}.row{border-bottom:1px solid #ddd;padding:8px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd}.reference-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.reference-card{border:1px solid #ddd;border-radius:10px;padding:12px}.reference-image{width:100%;height:220px;object-fit:contain;background:#eee;border-radius:8px}</style>
</head><body><p><a href="/">Dashboard</a> | <a href="/images">Images</a> | <a href="/people">People</a></p>{% block body %}{% endblock %}</body></html>
