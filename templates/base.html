<!doctype html><html><head><meta charset="utf-8"><title>Image Librarian</title>
<style>
body{font-family:system-ui,Arial;margin:24px;background:#f7f7f7;color:#18202a}a{color:#0645ad}.card{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #ccc}.grid{display:grid;grid-template-columns:120px 1fr 120px 220px;gap:12px;align-items:start}.thumb{max-width:110px;max-height:90px;border-radius:8px}.bad{color:#a00}.ok{color:#070}input,textarea,select{width:100%;padding:8px;box-sizing:border-box}button{padding:8px 12px;margin:4px}.row{border-bottom:1px solid #ddd;padding:8px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd}.reference-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.reference-card{border:1px solid #ddd;border-radius:10px;padding:12px}.reference-image{width:100%;height:220px;object-fit:contain;background:#eee;border-radius:8px}
.map-toolbar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:.75rem}.map-toolbar input{flex:1;min-width:260px}.archive-map-stage{position:relative;min-height:540px;background:#0b1020;border-radius:12px;overflow:hidden}.archive-map-stage svg{display:block;width:100%;height:min(72vh,760px);touch-action:none}.map-tooltip{display:none;position:absolute;z-index:10;max-width:320px;padding:8px 10px;background:rgba(15,23,42,.95);color:#fff;border:1px solid #475569;border-radius:8px;pointer-events:none}.point-editor{margin-top:16px;padding:14px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc}.error{color:#a00;padding:.5rem;background:#fee;border:1px solid #d99;border-radius:6px}
</style>
</head><body><p><a href="/">Dashboard</a> | <a href="/images">Images</a> | <a href="/archive-map">Archive Map</a> | <a href="/people">People</a></p>{% block body %}{% endblock %}</body></html>
